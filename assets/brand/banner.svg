<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Cyril Foday-Kailie  Software Engineer &amp; Product Designer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1612"/>
      <stop offset="45%" stop-color="#12251C"/>
      <stop offset="100%" stop-color="#1A3328"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7CB89A" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#C4A35A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7CB89A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CB89A" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7CB89A"/>
      <stop offset="65%" stop-color="#C4A35A"/>
      <stop offset="100%" stop-color="#C4A35A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7CB89A" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <ellipse cx="980" cy="40" rx="280" ry="160" fill="url(#glow)"/>
  <ellipse cx="180" cy="320" rx="240" ry="120" fill="#7CB89A" fill-opacity="0.06"/>

  <!-- Mark -->
  <g transform="translate(72,118)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#163528" stroke="#7CB89A" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M22 48 L36 22 L50 48 Z" fill="none" stroke="#C4A35A" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="36" cy="40" r="3.5" fill="#7CB89A"/>
    <path d="M18 54 H54" stroke="#7CB89A" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <text x="168" y="148" fill="#E8EFE9" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700">Cyril Foday-Kailie</text>
  <text x="168" y="188" fill="#9FBEAE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">Software Engineer · Full-Stack · AI Systems · Product Design</text>

  <rect x="168" y="214" width="520" height="2" fill="url(#line)"/>

  <text x="168" y="252" fill="#D7E5DC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">I design and ship interfaces, data systems, and AI tools</text>
  <text x="168" y="278" fill="#D7E5DC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">where the experience is as deliberate as the architecture.</text>

  <!-- Corner craft marks -->
  <g fill="none" stroke="#7CB89A" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M40 40 H70 M40 40 V70"/>
    <path d="M1160 40 H1130 M1160 40 V70"/>
    <path d="M40 320 H70 M40 320 V290"/>
    <path d="M1160 320 H1130 M1160 320 V290"/>
  </g>

  <text x="980" y="300" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3">ST. PAUL, MN · OPEN TO WORK</text>
</svg>
